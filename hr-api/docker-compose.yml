version: '3.8'

services:
  hr-db:
    image: postgres:15-alpine
    container_name: hr-db
    environment:
      POSTGRES_USER: hruser
      POSTGRES_PASSWORD: hrpass
      POSTGRES_DB: hr
    ports:
      - "5438:5432"
    volumes:
      - hr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hruser -d hr"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hr-db-data:
