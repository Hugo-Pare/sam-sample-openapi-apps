version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: blog-db
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpass
      POSTGRES_DB: blog
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
