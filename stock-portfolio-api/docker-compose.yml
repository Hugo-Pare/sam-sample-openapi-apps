version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stock-portfolio-db
    environment:
      POSTGRES_USER: stockuser
      POSTGRES_PASSWORD: stockpass
      POSTGRES_DB: stockportfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockuser"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
